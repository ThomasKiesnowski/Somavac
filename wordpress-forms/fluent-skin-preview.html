<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOMAVAC — Fluent Forms skin preview</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#eef0f6;font-family:'Source Sans 3',sans-serif;padding:48px 20px;}
  .wrap{max-width:600px;margin:0 auto;}
  .note{max-width:600px;margin:0 auto 22px;font-size:13px;color:#475569;line-height:1.5;}
  .note b{color:#02055e;}

  /* ---- Minimal slice of Fluent Forms CORE layout (present on the real site) ---- */
  .frm-fluent-form .ff-t-container{display:flex;gap:20px;}
  .frm-fluent-form .ff-t-cell{flex:1;}
  @media(max-width:480px){ .frm-fluent-form .ff-t-container{flex-direction:column;gap:0;} }

  /* ============================================================
     EXACT skin from the theme's assets/theme.css (.frm-fluent-form)
     ============================================================ */
  .frm-fluent-form {
    background: #fff; border-radius: 1rem;
    box-shadow: 0 2px 4px rgba(4,7,142,.04), 0 8px 24px rgba(4,7,142,.08), 0 24px 60px rgba(4,7,142,.12);
    padding: 2rem; font-family: "Source Sans 3", Verdana, sans-serif;
  }
  @media (min-width: 1024px) { .frm-fluent-form { padding: 2.5rem; } }
  .frm-fluent-form .ff-el-group { margin-bottom: 1.5rem; }
  .frm-fluent-form .ff-el-input--label label,
  .frm-fluent-form .ff-el-input--label { color: #02055e; font-weight: 500; font-size: .9rem; margin-bottom: .5rem; display:block; }
  .frm-fluent-form .ff-el-is-required.asterisk-right label:after { content:" *"; color: #ea5329; }
  .frm-fluent-form .ff-el-form-control,
  .frm-fluent-form input[type=text], .frm-fluent-form input[type=email],
  .frm-fluent-form input[type=tel], .frm-fluent-form textarea, .frm-fluent-form select {
    width:100%; box-sizing:border-box; border-radius: 12px; background: #f9fafb; border: 1px solid #e5e7eb;
    padding: 12px 16px; font-size: .95rem; color: #1f2937;
    transition: border-color .15s, box-shadow .15s, background-color .15s;
  }
  .frm-fluent-form .ff-el-form-control::placeholder { color: #9ca3af; }
  .frm-fluent-form .ff-el-form-control:focus,
  .frm-fluent-form input:focus, .frm-fluent-form textarea:focus, .frm-fluent-form select:focus {
    border-color: #4345a7; background: #fff; box-shadow: 0 0 0 3px #c5c6e3; outline: none;
  }
  .frm-fluent-form textarea { resize: none; }
  .frm-fluent-form .ff-btn-submit, .frm-fluent-form button[type=submit] {
    width: 100%; background: #ea5329; color: #fff; border: none; border-radius: 9999px;
    padding: 16px 32px; font-family: "Source Sans 3", Verdana, sans-serif; font-weight: 600; font-size: 1rem;
    cursor: pointer; transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, background-color .2s;
  }
  .frm-fluent-form .ff-btn-submit:hover, .frm-fluent-form button[type=submit]:hover {
    background: #c44422; transform: translateY(-2px); box-shadow: 0 8px 30px -8px rgba(234,83,41,.5);
  }
  .frm-fluent-form .ff-btn-submit:active, .frm-fluent-form button[type=submit]:active { transform: translateY(0); }
</style>
</head>
<body>
<p class="note">This uses the <b>real Fluent Forms HTML classes</b> (<code>.frm-fluent-form</code>, <code>.ff-el-form-control</code>, <code>.ff-btn-submit</code>) with the <b>exact CSS baked into the theme</b>. This is how your live Fluent Form (id 1) will look after re-upload.</p>

<div class="wrap">
  <form class="frm-fluent-form fluent_form_1 ff-el-form-top" onsubmit="event.preventDefault();alert('preview only');">

    <!-- Name (two-column, like Fluent Forms' Name field) -->
    <div class="ff-el-group ff-name-field-wrapper">
      <div class="ff-t-container">
        <div class="ff-t-cell">
          <div class="ff-el-input--label ff-el-is-required asterisk-right"><label>First Name</label></div>
          <div class="ff-el-input--content"><input type="text" class="ff-el-form-control" placeholder="John"></div>
        </div>
        <div class="ff-t-cell">
          <div class="ff-el-input--label ff-el-is-required asterisk-right"><label>Last Name</label></div>
          <div class="ff-el-input--content"><input type="text" class="ff-el-form-control" placeholder="Doe"></div>
        </div>
      </div>
    </div>

    <div class="ff-el-group">
      <div class="ff-el-input--label ff-el-is-required asterisk-right"><label>Email</label></div>
      <div class="ff-el-input--content"><input type="email" class="ff-el-form-control" placeholder="john@example.com"></div>
    </div>

    <div class="ff-el-group">
      <div class="ff-el-input--label"><label>I am a...</label></div>
      <div class="ff-el-input--content">
        <select class="ff-el-form-control">
          <option>Select one</option><option>Surgeon / Physician</option><option>Patient</option>
          <option>Caregiver</option><option>Distributor / Partner</option><option>Other</option>
        </select>
      </div>
    </div>

    <div class="ff-el-group">
      <div class="ff-el-input--label"><label>Message</label></div>
      <div class="ff-el-input--content"><textarea class="ff-el-form-control" rows="4" placeholder="How can we help you?"></textarea></div>
    </div>

    <button type="submit" class="ff-btn ff-btn-submit ff-btn-md">Send Inquiry</button>
  </form>
</div>
</body>
</html>
