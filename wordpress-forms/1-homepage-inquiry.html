<!--
  SOMAVAC — Homepage "Send Inquiry" form
  ============================================================
  HOW TO USE IN WORDPRESS:
  1. Edit the page in the block editor.
  2. Add a block → search "Custom HTML" → add it.
  3. Paste this ENTIRE file into that block. Update the page.
  4. Point the form at your handler: replace REPLACE_WITH_YOUR_FORM_ENDPOINT
     below with your POST endpoint URL. (method + name attributes are ready.)
  Everything is self-contained — no Tailwind or theme CSS required.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap');
.smv-form-wrap{--navy-700:#02055e;--navy-800:#020347;--navy-400:#4345a7;--navy-100:#c5c6e3;--coral-500:#ea5329;--coral-600:#c44422;--gray-800:#1f2937;--gray-500:#6b7280;--gray-400:#9ca3af;--gray-200:#e5e7eb;--gray-50:#f9fafb;max-width:560px;margin:0 auto;}
.smv-form-wrap *{box-sizing:border-box;}
.smv-form{background:#fff;border-radius:16px;padding:40px;box-shadow:0 2px 4px rgba(4,7,142,.04),0 8px 24px rgba(4,7,142,.08),0 24px 60px rgba(4,7,142,.12);font-family:'Source Sans 3',Verdana,Geneva,sans-serif;}
@media(max-width:640px){.smv-form{padding:28px;}}
.smv-form h3{font-family:'Montserrat',Arial,sans-serif;font-weight:700;color:var(--navy-800);font-size:20px;line-height:1.3;margin:0 0 8px;}
.smv-form .smv-intro{color:var(--gray-500);font-size:14px;margin:0 0 24px;line-height:1.5;}
.smv-field{margin-bottom:24px;}
.smv-row{display:grid;gap:24px;margin-bottom:24px;}
@media(min-width:640px){.smv-row{grid-template-columns:1fr 1fr;}}
.smv-row .smv-field{margin-bottom:0;}
.smv-form label{display:block;font-weight:500;color:var(--navy-700);font-size:14px;margin-bottom:8px;}
.smv-form input,.smv-form select,.smv-form textarea{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--gray-200);font-family:inherit;font-size:14px;color:var(--gray-800);background:var(--gray-50);transition:border-color .15s,box-shadow .15s,background-color .15s;}
.smv-form input::placeholder,.smv-form textarea::placeholder{color:var(--gray-400);}
.smv-form input:focus,.smv-form select:focus,.smv-form textarea:focus{outline:none;border-color:var(--navy-400);box-shadow:0 0 0 3px var(--navy-100);background:#fff;}
.smv-form textarea{resize:none;}
.smv-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
.smv-btn{width:100%;background:var(--coral-500);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:16px;padding:16px 32px;border-radius:9999px;margin-top:4px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background-color .2s;}
.smv-btn:hover{background:var(--coral-600);transform:translateY(-2px);box-shadow:0 8px 30px -8px rgba(234,83,41,.5);}
.smv-btn:active{transform:translateY(0);}
.smv-btn:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(234,83,41,.25);}
</style>

<div class="smv-form-wrap">
  <form class="smv-form" action="REPLACE_WITH_YOUR_FORM_ENDPOINT" method="POST">
    <!-- honeypot: real users leave this blank; bots often fill it -->
    <div class="smv-hp" aria-hidden="true"><label>Leave blank<input type="text" name="_honey" tabindex="-1" autocomplete="off"></label></div>

    <div class="smv-row">
      <div class="smv-field">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" required placeholder="John">
      </div>
      <div class="smv-field">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" required placeholder="Doe">
      </div>
    </div>
    <div class="smv-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="john@example.com">
    </div>
    <div class="smv-field">
      <label for="role">I am a...</label>
      <select id="role" name="role">
        <option value="">Select one</option>
        <option value="surgeon">Surgeon / Physician</option>
        <option value="patient">Patient</option>
        <option value="caregiver">Caregiver</option>
        <option value="distributor">Distributor / Partner</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="smv-field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="How can we help you?"></textarea>
    </div>
    <button type="submit" class="smv-btn">Send Inquiry</button>
  </form>
</div>
